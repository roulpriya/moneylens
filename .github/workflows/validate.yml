name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies and build plugin
        run: npm ci && npm run build
      - name: Test bundled report behavior
        run: npm run test:ui
      - name: Verify committed HTML is reproducible
        run: git diff --exit-code -- skills/moneylens-automation/assets/report-template.html
      - name: Install PDF helper dependencies
        run: python3 -m pip install -r skills/moneylens-automation/scripts/requirements.txt
      - name: Run synthetic behavioral tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python PDF helper interface without accessing Keychain
        run: python3 skills/moneylens-automation/scripts/pdf_extract.py --help
