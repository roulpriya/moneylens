name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MONEYLENS_TEST_PYTHON: python
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies and build plugin
        run: npm ci && npm run build
      - name: Install PDF helper dependencies
        run: python -m pip install -r plugins/moneylens/skills/automation/scripts/requirements.txt
      - name: Test bundled report behavior
        run: npm run test:ui
      - name: Verify compiled template matches its Bun source
        run: npm run check:report
      - name: Verify private setup template matches its source
        run: npm run check:setup
      - name: Verify committed HTML is reproducible
        run: git diff --exit-code -- plugins/moneylens/skills/automation/assets/report-template.html plugins/moneylens/skills/automation/assets/report-fonts.html plugins/moneylens/skills/setup/assets/setup.html
      - name: Run synthetic behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Check the portable Python command interface
        run: python plugins/moneylens/skills/automation/scripts/moneylens.py --help
      - name: Check the separate PDF processing script
        run: python plugins/moneylens/skills/automation/scripts/pdf_extract.py --help
