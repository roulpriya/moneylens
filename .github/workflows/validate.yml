name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic behavioral tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile native PDF helper
        run: swiftc skills/moneylens-automation/scripts/pdf_extract.swift -o "$RUNNER_TEMP/pdf-extract"
      - name: Check native helper interface without accessing Keychain
        run: '"$RUNNER_TEMP/pdf-extract" --help'
