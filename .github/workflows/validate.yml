name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MONEYLENS_TEST_PYTHON: python
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Verify the plugin folder holds only allowlisted files
        run: npm run check:plugin
      - name: Verify compiled report template and fonts match their Bun source
        run: npm run check:report
      - name: Verify private setup template matches its source
        run: npm run check:setup
      - name: Install PDF helper dependencies
        run: python -m pip install -r plugins/moneylens/skills/automation/scripts/requirements.txt
      - name: Test bundled report behavior
        run: npm run test:ui
      - name: Run synthetic behavioral tests
        run: python -m unittest discover -s tests -v
